name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ZambieLib is a compile-time dependency resolved from the local maven
      # repo, so every target's copy is built here before the mod is.
      - name: Check out ZambieLib
        uses: actions/checkout@v4
        with:
          repository: TinsleyDevers/ZambieLib
          path: .zambielib

      # The daemon runs on 25 because fabric-loom needs it. The per-target
      # toolchains (17 for 1.20.1, 21 for the 1.21 line) are provisioned by the
      # foojay resolver in settings.gradle.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish ZambieLib to the local maven repo
        working-directory: .zambielib
        run: chmod +x gradlew && ./gradlew publishToMavenLocal --no-daemon

      - name: Build every target
        run: chmod +x gradlew && ./gradlew assembleAll --no-daemon

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: discordpresence-jars
          path: "*/build/libs/*.jar"
          if-no-files-found: error
