plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

legacyForge {
    version = '1.20.1-47.3.0'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        discordrpc {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Shared internals, published to the local maven repo from the ZambieLib
    // project (gradlew publishToMavenLocal there). Ships as its own mod at runtime.
    compileOnly 'com.tinsl.zambielib:zambielib:1.1.0+1.20.1-forge'
}

base.archivesName = 'DiscordPresence'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
