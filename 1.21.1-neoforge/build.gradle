plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}


neoForge {
    version = '21.1.248'
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        discordrpc {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Shared internals, published to the local maven repo from the ZambieLib
    // project (gradlew publishToMavenLocal there). Ships as its own mod at runtime.
    compileOnly 'com.tinsl.zambielib:zambielib:1.1.1+1.21.1-neoforge'
}

base.archivesName = 'DiscordPresence'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
