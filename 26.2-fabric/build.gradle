plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // Loom adds the Minecraft and Fabric repositories automatically.
    maven { url = 'https://maven.terraformersmc.com/releases' }
}

loom {
    mods {
        discordrpc {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.156.0+26.2'

    // Optional: adds the config button to Mod Menu's list.
    compileOnly 'com.terraformersmc:modmenu:18.0.0'
}

base.archivesName = 'DiscordPresence'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
