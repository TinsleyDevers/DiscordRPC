[[mods]]
modId="discordrpc"
version="1.2.0"
displayName="DiscordPresence"
authors="ZambieD"
description='''
Show your Minecraft session on Discord — exactly the way you want it.

Open the editor (F6, or the Config button in the mod list) and click any part
of the live Discord card to change it: text, images, buttons, timestamp. The
mod switches profiles automatically as you move between the main menu,
singleplayer and multiplayer.

Features:
  - Context profiles for Main Menu, Singleplayer and Multiplayer
  - Per-server profiles matched by address
  - Per-dimension and per-screen overrides that inherit anything you don't change
  - 26 live placeholders: player, biome, coordinates, health, ping and more
  - Custom images: drop PNGs into config/discordrpc/images/
  - Privacy toggles for server IP and coordinates, plus AFK detection
  - Reconnects automatically when Discord restarts
  - Warns you when a launcher's own Discord status is hiding the mod's
'''

[[dependencies.discordrpc]]
    modId="neoforge"
    type="required"
    versionRange="[26.2,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.discordrpc]]
    modId="minecraft"
    type="required"
    versionRange="[26.2,27)"
    ordering="NONE"
    side="BOTH"
