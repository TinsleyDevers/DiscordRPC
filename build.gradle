// DiscordPresence — multi-version root build
//
// Subprojects:
//   1.20.1-forge       Minecraft 1.20.1,  Forge 47.x (via ModDevGradle legacy), Java 17
//   1.21.1-neoforge    Minecraft 1.21.1,  NeoForge 21.1.x,  Java 21
//   1.21.11-neoforge   Minecraft 1.21.11, NeoForge 21.11.x, Java 21
//   26.1.2-neoforge    Minecraft 26.1.2,  NeoForge 26.1.x,  Java 25
//   26.1.2-fabric      Minecraft 26.1.2,  Fabric Loader,    Java 25
//
// Requires Gradle 9.5+ running on Java 25 (fabric-loom needs the newer JVM;
// per-project toolchains still compile 1.20.1 with 17 and 1.21.x with 21).
//
// Build everything:        ./gradlew assembleAll
// Build a single target:   ./gradlew :26.1.2-fabric:build
// Outputs land in each subproject's build/libs/

allprojects {
    group   = 'com.tinsl.discordrpc'
    version = '1.2.0'
}

// Top-level convenience: a single `assembleAll` task that builds every loader jar.
tasks.register('assembleAll') {
    group = 'build'
    description = 'Build the mod jar for every supported Minecraft version and loader.'
    dependsOn subprojects.collect { ":${it.name}:assemble" }
}
